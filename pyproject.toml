[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patientia"
version = "1.0.0"
description = "Herramienta avanzada para la generación de datos sintéticos en el ámbito de la salud"
authors = [
    {name = "Patientia Team", email = "team@patientia.dev"}
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
keywords = ["synthetic-data", "healthcare", "ai", "machine-learning", "clinical-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    # Core data science
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    # Synthetic data generation
    "sdv>=1.0.0",
    "ctgan>=0.7.0",
    "copulas>=0.9.0",
    # Machine learning & AI
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "hdbscan>=0.8.0",
    "umap-learn>=0.5.0",
    "faiss-cpu>=1.7.0",
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    # Medical NLP
    "medspacy>=1.0.0",
    "spacy>=3.6.0",
    # LangChain ecosystem
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langgraph>=0.1.0",
    "langsmith>=0.1.0",
    # LLM providers
    "langchain-groq>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-ollama>=0.1.0",
    # Web interface
    "streamlit>=1.25.0",
    # Configuration & utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    # Development & testing
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "notebook>=7.0.0",
    "groq>=0.32.0",
    "pydantic-settings>=2.11.0",
    "fastapi>=0.118.3",
    "uvicorn[standard]>=0.37.0",
    "python-multipart>=0.0.20",
    "psutil>=7.1.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    
    # Code quality
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    
    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

full = [
    # Additional ML libraries
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
    "optuna>=3.0.0",
    
    # Additional data formats
    "pyarrow>=12.0.0",
    "openpyxl>=3.1.0",
    
    # Database connectivity
    "sqlalchemy>=2.0.0",
    "pymongo>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/username/patientia"
Documentation = "https://patientia.readthedocs.io"
Repository = "https://github.com/username/patientia.git"
Issues = "https://github.com/username/patientia/issues"

[project.scripts]
patientia = "src.orchestration.main:main"
patientia-chat = "interfaces.chat_llm:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src", "interfaces", "tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

